# Copy to config.toml and edit. The tool never rewrites this file, so your
# comments and formatting survive.
#
#   python -m jobsearch config      shows the effective settings and any problems

# ---------------------------------------------------------------- master switch

# false: the pipeline sources, scores, tailors, and verifies, then STOPS before
#        sending anything. Everything lands in the review queue.
# true:  applications that pass every policy check are sent without asking.
#
# Leave this false until you have watched a few runs and trust the fit scores.
# Sending reaches real employers under your name and cannot be undone.
autonomous = false

# ---------------------------------------------------------------- which model

[llm]
# "gemini"    free tier, rate-limited per minute and per day. The default.
# "anthropic" paid, no free tier for the API.
# ""          auto: whichever API key it finds, Gemini first.
#
# Key goes in .env (GEMINI_API_KEY=... or ANTHROPIC_API_KEY=...), never here --
# this file is committed, .env is not.
provider = "gemini"

# "" uses the provider's default: gemini-2.5-flash / claude-sonnet-5.
# Gemini 2.5 models think before answering, and that thinking is billed against
# max_tokens below. If you see "hit the token ceiling before producing any
# text", either raise max_tokens or switch to "gemini-2.0-flash", which does not
# think.
model = ""

# One tailoring produces a resume, a cover letter, and fit notes. 8000 leaves
# room for a thinking budget on top of that.
max_tokens = 8000

# ---------------------------------------------------------------- what to look for

[search]
# Titles you would actually take. Matched loosely against the posting title.
titles = [
    "Backend Engineer",
    "Senior Backend Engineer",
    "Platform Engineer",
    "Software Engineer",
]

# Extra signal for scoring. Postings missing all of these rank lower.
keywords = ["python", "postgresql", "kubernetes", "api"]

# Free text, matched against the posting location. Empty means anywhere.
locations = ["Remote", "United States"]
remote_only = false

# False: a remote posting passes whatever place it names. True: one that names a place
# ("Remote in Canada", "LATAM") has to be open to one on the list above too; "Remote"
# and "Worldwide" name none and still pass.
locations_apply_to_remote = false

# Places never wanted, remote or not. Whole words ("India" leaves "Indianapolis"
# alone), and unlike `locations` this also catches "Remote - India".
exclude_locations = []

# Never apply to these, whatever the score.
exclude_companies = []

# Drop any posting whose text contains one of these.
exclude_keywords = ["security clearance", "unpaid", "commission only"]

# Drop a posting whose TITLE has one of these as a whole word ("lead" does not
# match "Leadership"). Seniority belongs here rather than in exclude_keywords,
# which also reads the description and so drops every posting that mentions
# "senior engineers" in passing. For example:
#   ["senior", "sr.", "staff", "principal", "lead", "manager", "director"]
exclude_title_keywords = []

# The opposite: drop a posting unless its TITLE has one of these as a whole word
# ("intern" does not match "Internal" or "International"). This is how a student
# keeps to roles open to a student. Empty means any level passes. For example:
#   ["intern", "internship", "co-op", "trainee", "apprentice", "apprenticeship",
#    "student", "fellowship"]
# and put "new grad", "graduate", "early career" and "phd" in exclude_title_keywords
# above, since those need a finished degree.
require_title_keywords = []

# Most years of experience a posting may ask for, read from phrases such as
# "3+ years of experience" or "at least 2 years". A posting that names several
# figures is judged by the smallest, so a stray "10 years" about the team does not
# sink it, and "2 years of university" is schooling, not experience. 0 means none
# at all; leave it out and nothing is checked.
# max_experience_years = 1

# true: freelance and contract postings (the sources that say so: Remotive, Jobicy,
# Himalayas, Lever, Ashby, Superteam Earn) skip the title and level rules above, which are
# written for jobs, and are judged on the rest. They show on the dashboard as freelance and
# are never tailored or applied to for you. false: screened like any posting.
include_freelance = false

# Fit score floor, 0-100. Measures how much of what a posting most insists on
# your record actually covers.
#
# Calibrated against 544 live postings from one large company's board: sales and
# support roles scored 0, the median across everything was ~7, and the genuinely
# matching engineering roles landed at 35-43. So 30 is a real threshold, not a
# timid one -- it admits the top band and rejects the rest.
#
# Run `python -m jobsearch jobs` after a pass to see your own distribution
# before changing this. Do not assume 80 means "good"; nothing scores 80.
min_fit = 30

# Ignore postings older than this. A company board lists only what is still open,
# and internships stay open for months, so a short window hides live ones: a
# 38-day-old Stripe internship was dropped at 30. Raise it if you look for those.
max_age_days = 30

# ---------------------------------------------------------------- where to look

# Public job-board endpoints. Greenhouse, Lever, and Ashby need no key: one
# request per company board. Add the companies you actually want to work at.

# A starting set of company boards, each one probed against the live API before
# being listed -- a token that 404s or returns nothing is silent failure, so
# none are included on faith. Counts are from 2026-08-24 and will drift; they
# are here only to show which boards carry weight. Trim this to the companies
# you would actually work for: more boards is more postings to score, not more
# postings worth applying to.
[sources.greenhouse]
enabled = true
# The token is the last path segment of boards.greenhouse.io/<token>
boards = [
    "databricks",   # 821
    "stripe",       # 579
    "anthropic",    # 516
    "datadog",      # 450
    "mongodb",      # 405
    "cloudflare",   # 310
    "brex",         # 294
    "elastic",      # 249
    "scaleai",      # 208
    "gitlab",       # 203
    "airbnb",       # 189
    "coinbase",     # 173
    "figma",        # 162
    "reddit",       # 151
    "twilio",       # 145
    "robinhood",    # 130
    "asana",        # 126
    "vercel",       #  83
    "proton",       #  76
    "discord",      #  51
    "turing",       #  23
]

[sources.lever]
enabled = false
# The slug in jobs.lever.co/<company>
companies = ["netflix"]

# A community-kept list of every open internship, read as the public JSON file it
# publishes (github.com/SimplifyJobs/Summer2027-Internships). It is a directory: each
# listing has the employer's own apply link, and the posting's text is fetched from its
# Greenhouse, Lever or Ashby page when it has one, which also confirms it is still open.
# Only listings that would survive the search filters above are kept, `limit` bounds how
# many new ones are taken per run, and the rest are leads to open by hand.
[sources.simplify]
enabled = false
terms = ["Summer 2027"]
categories = ["Software", "AI/ML/Data"]
degrees = ["Bachelor's"]
exclude_sponsorship = ["U.S. Citizenship is Required", "Does Not Offer Sponsorship"]
limit = 300

[sources.ashby]
enabled = true
# The name in jobs.ashbyhq.com/<name>
boards = [
    "openai",       # 753
    "snowflake",    # 392
    "ramp",         # 136
    "notion",       # 128
    "plaid",        # 104
    "docker",       #  59
    "confluent",    #  30
    "andela",       #  17
    "zapier",       #   8
    "quora",        #   6
    "buffer",       #   3
]

# ---------------------------------------------------------- remote job boards
#
# Aggregator boards that publish a public API for exactly this. No key, no
# account, no per-company slug -- enabling one is just naming it. These are
# where postings are FOUND; the application itself is still submitted on
# whatever ATS the listing links out to.
#
# Absent on purpose: Wellfound and FlexJobs forbid automated access, and
# Upwork/Fiverr/Toptal/PeoplePerHour are freelance marketplaces that need an
# authenticated account. Same reasoning as LinkedIn and Indeed -- a banned
# account costs more than the listings are worth.

[sources.remotive]
enabled = true
limit = 100

[sources.remoteok]
enabled = true
limit = 100

[sources.himalayas]
enabled = true
limit = 50

[sources.jobicy]
enabled = true
limit = 50

[sources.workingnomads]
enabled = true
limit = 100

# General German job board; only a small fraction of it is remote.
[sources.arbeitnow]
enabled = false
limit = 50

# Broad aggregators. Both are legitimate public developer APIs with free keys.
[sources.adzuna]
enabled = false
app_id = ""
app_key = ""
country = "us"          # us, gb, ca, au, ...
results_per_page = 50
max_pages = 2

[sources.usajobs]
enabled = false
email = ""              # the address you registered with
api_key = ""
results_per_page = 50

# There is deliberately no Indeed connector. Indeed has no public read API and
# blocks scraping. There is deliberately no LinkedIn connector either -- see the
# note at the bottom of this file.

# ---------------------------------------------------------------- rate limits

[limits]
# Volume is not the goal. These caps exist so a bad scoring day cannot turn into
# fifty identical applications with your name on them.
max_applications_per_day = 10
max_applications_per_run = 5
max_per_company_per_week = 2

# Tailoring costs an API call each, so cap it independently of sending.
max_tailor_per_run = 8

# ---------------------------------------------------------------- how to apply

[dispatch]
# Tried in order; the first channel that can handle a posting wins.
channel_order = ["ats_form", "email"]

# Refuse to send anything the grounding check flagged. Strongly recommended:
# this is what stops an invented metric reaching an employer.
require_clean_grounding = true

# Refuse to use profile rows a model extracted but you have not confirmed.
# Turn this on once you have run `python -m jobsearch review`.
require_verified_records = false

[dispatch.email]
enabled = false
# From Google Cloud Console: create an OAuth client (Desktop app), enable the
# Gmail API, download the JSON. First send opens a browser once to authorize.
credentials_file = "gmail_credentials.json"
token_file = "gmail_token.json"
from_name = ""
reply_to = ""
daily_cap = 20

[dispatch.ats]
# Fills Greenhouse/Lever/Ashby application forms in a real browser.
# Needs: pip install playwright && playwright install chromium
enabled = false
headless = true
timeout_seconds = 45
screenshot_dir = "output/_ats"

# ---------------------------------------------------------------- LinkedIn
#
# There is no LinkedIn automation and there will not be. Their User Agreement
# bans automated access and enforces it with account restrictions -- losing the
# account you job-hunt from is not worth a few saved clicks.
#
# What the tool does instead: drafts the connection note or DM, stores it, and
# gives you the deep link. You paste and send in your own browser.
#
#   python -m jobsearch outreach list
