# The project is small, so the build is kept small: one Gradle JVM with the Kotlin compiler inside it
# (not a second daemon), and few workers. A machine short of memory runs this; Android Studio's own
# defaults would not fit beside everything else on some.
org.gradle.jvmargs=-Xmx1024m -XX:MaxMetaspaceSize=320m -Dfile.encoding=UTF-8
org.gradle.workers.max=2
org.gradle.caching=false
kotlin.compiler.execution.strategy=in-process
android.nonTransitiveRClass=true
kotlin.code.style=official
